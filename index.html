<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoreo Energía Planta</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#08122c;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:55px;
}

.registro{
    text-align:center;
    font-size:24px;
    margin-bottom:30px;
    color:#00e5ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:#1e2a44;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.label{
    font-size:22px;
    color:#cbd5e1;
}

.value{
    font-size:55px;
    font-weight:bold;
    margin-top:15px;
}

.footer{
    text-align:center;
    margin-top:40px;
    font-size:28px;
}

.fecha{
    margin-top:15px;
    color:white;
}

.actualizado{
    margin-top:15px;
    color:#22c55e;
}

</style>

</head>

<body>

<h1>⚡ Monitoreo Energía Planta</h1>

<div class="registro">
    Registro:
    <span id="registro">--</span>
</div>

<div class="grid">

    <div class="card">
        <div class="label">Voltaje R</div>
        <div class="value" id="vR">--</div>
    </div>

    <div class="card">
        <div class="label">Voltaje S</div>
        <div class="value" id="vS">--</div>
    </div>

    <div class="card">
        <div class="label">Voltaje T</div>
        <div class="value" id="vT">--</div>
    </div>

    <div class="card">
        <div class="label">Corriente R</div>
        <div class="value" id="aR">--</div>
    </div>

    <div class="card">
        <div class="label">Corriente S</div>
        <div class="value" id="aS">--</div>
    </div>

    <div class="card">
        <div class="label">Corriente T</div>
        <div class="value" id="aT">--</div>
    </div>

</div>

<div class="footer">

    <div class="fecha">
        Fecha CSV:
        <span id="fecha">--</span>
    </div>

    <div class="actualizado">
        Última actualización:
        <span id="actualizado">--</span>
    </div>

</div>

<script>

async function cargarDatos() {

    try {

        const response = await fetch(
            'datos.json?t=' + new Date().getTime(),
            {
                cache: "no-store"
            }
        );

        const d = await response.json();

        // REGISTRO

        document.getElementById('registro').innerText =
            d.registro_actual + " / " + d.total_registros;

        // VOLTAJES

        document.getElementById('vR').innerText =
            d.voltaje_r + ' V';

        document.getElementById('vS').innerText =
            d.voltaje_s + ' V';

        document.getElementById('vT').innerText =
            d.voltaje_t + ' V';

        // CORRIENTES

        document.getElementById('aR').innerText =
            d.corriente_r + ' A';

        document.getElementById('aS').innerText =
            d.corriente_s + ' A';

        document.getElementById('aT').innerText =
            d.corriente_t + ' A';

        // FECHAS

        document.getElementById('fecha').innerText =
            d.fecha_hora;

        document.getElementById('actualizado').innerText =
            d.actualizado;

        console.log("DATOS ACTUALIZADOS");

    } catch (error) {

        console.error(error);

    }

}

// CARGA INICIAL
cargarDatos();

// ACTUALIZAR CADA 30 SEGUNDOS
setInterval(cargarDatos, 30000);

</script>

</body>

</html>
