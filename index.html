<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Monitor Planta</title>
    <style>
        body { background: #071126; color: white; font-family: Arial; padding: 20px; text-align: center; }
        .dato { font-size: 48px; color: #facc15; margin: 20px; }
        .normal { font-size: 24px; margin: 10px; }
        .verde { color: #22c55e; }
    </style>
</head>
<body>
    <h1>⚡ MONITOREO PLANTA</h1>
    <div class="dato" id="potencia">--- kW</div>
    <div class="normal" id="fecha">---</div>
    <div class="normal">Voltajes: <span id="voltajes">---</span></div>
    <div class="normal">Corrientes: <span id="corrientes">---</span></div>
    <div class="verde" id="estado">Esperando datos...</div>

    <script>
        async function cargar() {
            try {
                const res = await fetch('datos.json?t=' + Date.now());
                const d = await res.json();
                document.getElementById('potencia').innerHTML = d.potencia_kw + ' kW';
                document.getElementById('fecha').innerHTML = '📅 ' + d.fecha_hora;
                document.getElementById('voltajes').innerHTML = `${d.voltaje_r} / ${d.voltaje_s} / ${d.voltaje_t} V`;
                document.getElementById('corrientes').innerHTML = `${d.corriente_r} / ${d.corriente_s} / ${d.corriente_t} A`;
                document.getElementById('estado').innerHTML = '✅ Actualizado: ' + new Date().toLocaleTimeString();
            } catch(e) {
                document.getElementById('estado').innerHTML = '❌ Error: ' + e.message;
            }
        }
        cargar();
        setInterval(cargar, 30000);
    </script>
</body>
</html>
