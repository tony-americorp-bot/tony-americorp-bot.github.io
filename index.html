<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Planta | Datos en Vivo</title>
    <style>
        body {
            background: #071126;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }
        .card {
            background: #111827;
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
        }
        .valor {
            font-size: 32px;
            font-weight: bold;
            color: #facc15;
        }
        .actualizado {
            color: #22c55e;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>📊 MONITOREO ENERGÉTICO</h1>
    
    <div class="card">
        <h2>⚡ Potencia Total</h2>
        <div class="valor" id="potencia">--- kW</div>
    </div>
    
    <div class="card">
        <h2>🔌 Voltajes por Fase</h2>
        <div class="valor" id="voltajes">---</div>
    </div>
    
    <div class="card">
        <h2>💡 Corrientes por Fase</h2>
        <div class="valor" id="corrientes">---</div>
    </div>
    
    <div class="card">
        <h2>🕐 Última actualización</h2>
        <div id="timestamp">---</div>
    </div>
    
    <div class="actualizado" id="status">
        🔄 Actualizando cada 30 segundos...
    </div>

    <script>
        async function cargarDatos() {
            try {
                const respuesta = await fetch('datos.json?t=' + Date.now());
                const datos = await respuesta.json();
                
                document.getElementById('potencia').innerText = datos.potencia_kw + ' kW';
                document.getElementById('voltajes').innerHTML = 
                    `R: ${datos.voltajes.r}V &nbsp;|&nbsp; S: ${datos.voltajes.s}V &nbsp;|&nbsp; T: ${datos.voltajes.t}V`;
                document.getElementById('corrientes').innerHTML = 
                    `R: ${datos.corrientes.r}A &nbsp;|&nbsp; S: ${datos.corrientes.s}A &nbsp;|&nbsp; T: ${datos.corrientes.t}A`;
                document.getElementById('timestamp').innerText = datos.timestamp;
                document.getElementById('status').innerHTML = `✅ Actualizado: ${new Date().toLocaleTimeString()}`;
                
            } catch (error) {
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        cargarDatos();
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>
