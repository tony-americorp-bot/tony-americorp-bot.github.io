<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA COLECTOR - ALARMAS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    overflow:hidden;
}

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ===== TOPBAR ===== */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

/* ===== SIDEBAR ===== */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
    border-bottom-right-radius:10px;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
}

/* ===== MAIN ===== */

.main-content{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ===== CONTADORES ===== */

.counters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:20px;
}

.counter-box{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    border:2px solid #b0b0b0;
}

.counter-number{
    font-size:42px;
    font-weight:bold;
}

.counter-title{
    margin-top:10px;
    font-size:14px;
    font-weight:bold;
}

.red{
    color:#d50000;
}

.green{
    color:#00c853;
}

.blue{
    color:#09234d;
}

/* ===== TOOLBAR ===== */

.toolbar{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    border:2px solid #b0b0b0;
}

.btn{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.02);
}

.btn-blue{
    background:#1565c0;
    color:white;
}

.btn-green{
    background:#00c853;
    color:white;
}

.btn-red{
    background:#d50000;
    color:white;
}

.btn-orange{
    background:#ff8f00;
    color:white;
}

/* ===== FILTROS ===== */

.filters{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    border:2px solid #b0b0b0;
}

.filters input,
.filters select{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    min-width:180px;
}

/* ===== TABLA ===== */

.table-container{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    overflow:auto;
    max-height:60vh;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#09234d;
    color:white;
    padding:14px;
    position:sticky;
    top:0;
    z-index:10;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f5f5;
}

.no-review{
    background:#fff3f3;
}

.reviewed{
    background:#f0f0f0;
    color:#666;
}

.trip{
    border-left:6px solid #8b0000;
}

.alarm{
    border-left:6px solid #d50000;
}

.warning{
    border-left:6px solid #ff8f00;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-trip{
    background:#8b0000;
    color:white;
}

.badge-alarm{
    background:#d50000;
    color:white;
}

.badge-warning{
    background:#ff8f00;
    color:black;
}

.badge-review{
    background:#00c853;
    color:white;
}

.badge-noreview{
    background:#d50000;
    color:white;
}

.checkbox{
    width:18px;
    height:18px;
    cursor:pointer;
}

/* ===== MODAL ===== */

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:5000;
}

.modal-content{
    background:white;
    padding:30px;
    border-radius:12px;
    width:400px;
    text-align:center;
}

.modal-buttons{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:15px;
}

</style>

</head>

<body>

<div class="container">

    <!-- ===== TOPBAR ===== -->

    <div class="topbar">

        <div class="logo-area">

            <div class="hamburguesa" onclick="toggleMenu()">
                ☰
            </div>

            <div class="logo">
                AMERICORP
            </div>

        </div>

        <div>
            HISTORIAL DE ALARMAS
        </div>

        <div class="fecha-hora" id="fechaHora">
            --:--:--
        </div>

    </div>

    <!-- ===== SIDEBAR ===== -->

    <div class="sidebar" id="sidebar">

        <div class="menu">

            <div class="menu-item" onclick="window.location.href='index.html'">
                📊 Dashboard
            </div>

            <div class="menu-item" style="background:#12356d;">
                🚨 Alarmas
            </div>

            <div class="menu-item" onclick="window.location.href='tendencias.html'">
                📈 Tendencias
            </div>

        </div>

        <div class="sidebar-imagen">

            <img src="colector.png">

        </div>

    </div>

    <!-- ===== MAIN ===== -->

    <div class="main-content">

        <!-- ===== CONTADORES ===== -->

        <div class="counters">

            <div class="counter-box">

                <div class="counter-number red" id="countNoReview">
                    0
                </div>

                <div class="counter-title">
                    NO REVISADAS
                </div>

            </div>

            <div class="counter-box">

                <div class="counter-number green" id="countReviewed">
                    0
                </div>

                <div class="counter-title">
                    REVISADAS
                </div>

            </div>

            <div class="counter-box">

                <div class="counter-number blue" id="countTotal">
                    0
                </div>

                <div class="counter-title">
                    TOTAL
                </div>

            </div>

        </div>

        <!-- ===== BOTONES ===== -->

        <div class="toolbar">

            <button class="btn btn-green" onclick="revisarSeleccionadas()">
                ✅ Revisar Seleccionadas
            </button>

            <button class="btn btn-blue" onclick="revisarTodas()">
                🔄 Revisar Todas
            </button>

            <button class="btn btn-orange" onclick="borrarRevisadas()">
                🗑️ Borrar Revisadas
            </button>

            <button class="btn btn-red" onclick="borrarTodas()">
                ❌ Borrar Todas
            </button>

            <button class="btn btn-blue" onclick="exportarPDF()">
                📄 Exportar PDF
            </button>

        </div>

        <!-- ===== FILTROS ===== -->

        <div class="filters">

            <input type="text" id="filtroTag" placeholder="Filtrar TAG">

            <input type="text" id="filtroMensaje" placeholder="Filtrar Mensaje">

            <select id="filtroSeveridad">

                <option value="">Todas Severidades</option>
                <option value="trip">TRIP</option>
                <option value="alarm">ALARMA</option>
                <option value="warning">WARNING</option>

            </select>

            <button class="btn btn-blue" onclick="renderTabla()">
                Aplicar
            </button>

        </div>

        <!-- ===== TABLA ===== -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            <input type="checkbox" id="selectAll">
                        </th>

                        <th>FECHA</th>
                        <th>TAG</th>
                        <th>CONDICIÓN</th>
                        <th>SEVERIDAD</th>
                        <th>MENSAJE</th>
                        <th>ESTADO</th>
                        <th>ACTIVA</th>

                    </tr>

                </thead>

                <tbody id="tablaAlarmas">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- ===== MODAL ===== -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h3 id="modalText">
            ¿Seguro?
        </h3>

        <div class="modal-buttons">

            <button class="btn btn-blue" id="btnConfirmar">
                Confirmar
            </button>

            <button class="btn btn-red" onclick="cerrarModal()">
                Cancelar
            </button>

        </div>

    </div>

</div>

<script>

/* ===== VARIABLES ===== */

let alarms = [];

/* ===== MENU ===== */

function toggleMenu(){

    document.getElementById("sidebar")
    .classList.toggle("activo");

}

/* ===== FECHA ===== */

function actualizarFechaHora(){

    const ahora = new Date();

    document.getElementById("fechaHora")
    .innerHTML =
    ahora.toLocaleTimeString() +
    " | " +
    ahora.toLocaleDateString();

}

setInterval(actualizarFechaHora,1000);

actualizarFechaHora();

/* ===== CARGAR ===== */

function cargarAlarmas(){

    const data =
    localStorage.getItem("scada_alarms");

    if(data){

        alarms = JSON.parse(data);

    }else{

        alarms = [];

    }

    renderTabla();

}

/* ===== GUARDAR ===== */

function guardarAlarmas(){

    localStorage.setItem(
        "scada_alarms",
        JSON.stringify(alarms)
    );

}

/* ===== TIEMPO ACTIVA ===== */

function tiempoActivo(fecha){

    const inicio = new Date(fecha);

    const ahora = new Date();

    const segundos =
    Math.floor((ahora - inicio)/1000);

    const minutos =
    Math.floor(segundos/60);

    const horas =
    Math.floor(minutos/60);

    if(horas > 0){

        return horas + "h " + (minutos%60) + "m";

    }

    if(minutos > 0){

        return minutos + "m";

    }

    return segundos + "s";

}

/* ===== BADGE ===== */

function badgeSeveridad(sev){

    if(sev === "trip"){

        return `
        <span class="badge badge-trip">
        🚨 TRIP
        </span>
        `;

    }

    if(sev === "alarm"){

        return `
        <span class="badge badge-alarm">
        ⚠️ ALARMA
        </span>
        `;

    }

    return `
    <span class="badge badge-warning">
    ⚡ WARNING
    </span>
    `;

}

/* ===== RENDER ===== */

function renderTabla(){

    const tbody =
    document.getElementById("tablaAlarmas");

    tbody.innerHTML = "";

    const filtroTag =
    document.getElementById("filtroTag")
    .value
    .toLowerCase();

    const filtroMensaje =
    document.getElementById("filtroMensaje")
    .value
    .toLowerCase();

    const filtroSeveridad =
    document.getElementById("filtroSeveridad")
    .value;

    let filtradas =
    [...alarms];

    if(filtroTag){

        filtradas =
        filtradas.filter(a =>
        a.tag.toLowerCase().includes(filtroTag));

    }

    if(filtroMensaje){

        filtradas =
        filtradas.filter(a =>
        a.message.toLowerCase().includes(filtroMensaje));

    }

    if(filtroSeveridad){

        filtradas =
        filtradas.filter(a =>
        a.severity === filtroSeveridad);

    }

    filtradas.sort((a,b)=>
    new Date(b.timestamp) -
    new Date(a.timestamp));

    document.getElementById("countTotal")
    .innerText = alarms.length;

    document.getElementById("countNoReview")
    .innerText =
    alarms.filter(a => !a.reviewed).length;

    document.getElementById("countReviewed")
    .innerText =
    alarms.filter(a => a.reviewed).length;

    if(filtradas.length === 0){

        tbody.innerHTML = `
        <tr>
            <td colspan="8"
            style="text-align:center;padding:30px;">
                NO EXISTEN ALARMAS
            </td>
        </tr>
        `;

        return;

    }

    filtradas.forEach(al => {

        const tr =
        document.createElement("tr");

        tr.classList.add(al.severity);

        tr.classList.add(
            al.reviewed ?
            "reviewed" :
            "no-review"
        );

        tr.innerHTML = `

        <td>
            <input
            type="checkbox"
            class="checkbox"
            data-id="${al.id}">
        </td>

        <td>
            ${new Date(al.timestamp)
            .toLocaleString()}
        </td>

        <td>
            ${al.tag}
        </td>

        <td>
            ${al.condition}
        </td>

        <td>
            ${badgeSeveridad(al.severity)}
        </td>

        <td>
            ${al.message}
        </td>

        <td>

            ${
                al.reviewed
                ?

                `<span class="badge badge-review">
                REVISADA
                </span>`

                :

                `<span class="badge badge-noreview">
                NO REVISADA
                </span>`
            }

        </td>

        <td>
            ${tiempoActivo(al.startTime)}
        </td>

        `;

        tbody.appendChild(tr);

    });

}

/* ===== CHECKBOX ===== */

document.addEventListener("change",function(e){

    if(e.target.id === "selectAll"){

        document.querySelectorAll(".checkbox")
        .forEach(cb => {

            cb.checked =
            e.target.checked;

        });

    }

});

/* ===== REVISAR ===== */

function revisarSeleccionadas(){

    document.querySelectorAll(".checkbox")
    .forEach(cb => {

        if(cb.checked){

            const id =
            Number(cb.dataset.id);

            const al =
            alarms.find(a => a.id === id);

            if(al){

                al.reviewed = true;

            }

        }

    });

    guardarAlarmas();

    renderTabla();

}

function revisarTodas(){

    abrirModal(
    "¿Revisar TODAS las alarmas?",
    () => {

        alarms.forEach(a => {

            a.reviewed = true;

        });

        guardarAlarmas();

        renderTabla();

    });

}

/* ===== BORRAR ===== */

function borrarRevisadas(){

    abrirModal(
    "¿Borrar alarmas revisadas?",
    () => {

        alarms =
        alarms.filter(a => !a.reviewed);

        guardarAlarmas();

        renderTabla();

    });

}

function borrarTodas(){

    abrirModal(
    "¿BORRAR TODO EL HISTORIAL?",
    () => {

        alarms = [];

        guardarAlarmas();

        renderTabla();

    });

}

/* ===== PDF ===== */

function exportarPDF(){

    const element =
    document.querySelector(".main-content");

    html2pdf()
    .from(element)
    .save("alarmas_scada.pdf");

}

/* ===== MODAL ===== */

function abrirModal(texto,callback){

    document.getElementById("modal")
    .style.display = "flex";

    document.getElementById("modalText")
    .innerText = texto;

    document.getElementById("btnConfirmar")
    .onclick = function(){

        callback();

        cerrarModal();

    };

}

function cerrarModal(){

    document.getElementById("modal")
    .style.display = "none";

}

/* ===== AUTO REFRESH ===== */

window.addEventListener("storage",function(e){

    if(e.key === "scada_alarms"){

        cargarAlarmas();

    }

});

setInterval(() => {

    cargarAlarmas();

},2000);

/* ===== INICIO ===== */

cargarAlarmas();

</script>

</body>
</html>
