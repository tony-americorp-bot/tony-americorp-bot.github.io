<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA COLECTOR - HISTORIAL DE ALARMAS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    height:100vh;
    overflow:hidden;
}

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

.btn-volver{
    background:#1d4ed8;
    color:white;
    padding:8px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
}

.main-content{
    flex:1;
    padding:20px;
    overflow:auto;
}

.counters-panel{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.counter-card{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:20px;
    flex:1;
    min-width:150px;
    text-align:center;
}

.counter-number{
    font-size:42px;
    font-weight:bold;
}

.counter-label{
    margin-top:10px;
    font-size:14px;
}

.unreviewed .counter-number{
    color:#d50000;
}

.reviewed .counter-number{
    color:#00c853;
}

.total .counter-number{
    color:#09234d;
}

.toolbar{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.btn-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.btn-success{ background:#00c853; }
.btn-primary{ background:#1d4ed8; }
.btn-warning{ background:#ff9800; }
.btn-danger{ background:#d50000; }
.btn-secondary{ background:#6c757d; }

.filters-bar{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.filter-input,
.filter-select{
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

.table-wrapper{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    overflow:auto;
    max-height:60vh;
}

.alarms-table{
    width:100%;
    border-collapse:collapse;
}

.alarms-table th{
    background:#09234d;
    color:white;
    padding:12px;
    position:sticky;
    top:0;
}

.alarms-table td{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:13px;
}

.unreviewed-row{
    background:#ffebee;
}

.reviewed-row{
    background:#f5f5f5;
}

.severity-badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.trip{
    background:#b71c1c;
    color:white;
}

.alarm{
    background:#d50000;
    color:white;
}

.warning{
    background:#ff9800;
    color:black;
}

.status-badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-reviewed{
    background:#00c853;
    color:white;
}

.status-unreviewed{
    background:#d50000;
    color:white;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:12px;
    width:400px;
    text-align:center;
}

.modal-buttons{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="topbar">

    <div class="logo-area">
        <div class="hamburguesa" onclick="toggleMenu()">☰</div>
        <div class="logo">AMERICORP</div>
    </div>

    <div>PROYECTO: COLECTOR DE POLVO | HISTORIAL DE ALARMAS</div>

    <div style="display:flex; gap:15px; align-items:center;">
        <div class="fecha-hora" id="fechaHora"></div>
        <a href="index.html" class="btn-volver">⬅ VOLVER</a>
    </div>

</div>

<div class="sidebar" id="sidebar">

    <div class="menu">
        <div class="menu-item" onclick="window.location.href='index.html'">📊 Dashboard</div>
        <div class="menu-item" style="background:#12356d;">🚨 Alarmas</div>
        <div class="menu-item" onclick="window.location.href='tendencias.html'">📈 Tendencias</div>
    </div>

    <div class="sidebar-imagen">
        <img src="colector.png">
    </div>

</div>

<div class="main-content">

<div class="counters-panel">

    <div class="counter-card unreviewed">
        <div class="counter-number" id="unreviewedCount">0</div>
        <div class="counter-label">⚠️ NO REVISADAS</div>
    </div>

    <div class="counter-card reviewed">
        <div class="counter-number" id="reviewedCount">0</div>
        <div class="counter-label">✅ REVISADAS</div>
    </div>

    <div class="counter-card total">
        <div class="counter-number" id="totalCount">0</div>
        <div class="counter-label">📋 TOTAL</div>
    </div>

</div>

<div class="toolbar">

<div class="btn-group">
    <button class="btn btn-success" id="reviewSelectedBtn">✅ REVISAR SELECCIONADAS</button>
    <button class="btn btn-primary" id="reviewAllBtn">🔄 REVISAR TODAS</button>
    <button class="btn btn-warning" id="clearReviewedBtn">🗑️ BORRAR REVISADAS</button>
    <button class="btn btn-danger" id="clearAllBtn">🗑️🗑️ BORRAR TODAS</button>
</div>

<div class="btn-group">
    <button class="btn btn-secondary" id="exportPdfBtn">📄 EXPORTAR PDF</button>
</div>

</div>

<div class="filters-bar">

<input type="text" id="filterTag" class="filter-input" placeholder="TAG">
<input type="text" id="filterMessage" class="filter-input" placeholder="MENSAJE">

<select id="filterSeverity" class="filter-select">
    <option value="">SEVERIDAD</option>
    <option value="trip">TRIP</option>
    <option value="alarm">ALARMA</option>
    <option value="warning">WARNING</option>
</select>

<select id="filterStatus" class="filter-select">
    <option value="">ESTADO</option>
    <option value="reviewed">REVISADAS</option>
    <option value="unreviewed">NO REVISADAS</option>
</select>

<button class="btn btn-primary" id="applyFiltersBtn">APLICAR</button>
<button class="btn btn-secondary" id="resetFiltersBtn">RESET</button>

</div>

<div class="table-wrapper">

<table class="alarms-table">

<thead>

<tr>
<th><input type="checkbox" id="selectAllCheckbox"></th>
<th>FECHA</th>
<th>TAG</th>
<th>SEVERIDAD</th>
<th>MENSAJE</th>
<th>ESTADO</th>
</tr>

</thead>

<tbody id="alarmsTableBody"></tbody>

</table>

</div>

</div>

</div>

<div id="confirmModal" class="modal">

<div class="modal-content">

<h3 id="modalMessage">¿Está seguro?</h3>

<div class="modal-buttons">
    <button class="btn btn-primary" id="modalConfirmBtn">CONFIRMAR</button>
    <button class="btn btn-secondary" id="modalCancelBtn">CANCELAR</button>
</div>

</div>

</div>

<script>

let alarmsArray = [];

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("activo");
}

        ahora.toLocaleTimeString() + " | " +
        ahora.toLocaleDateString();

}

setInterval(actualizarFechaHora,1000);
actualizarFechaHora();

async function cargarAlarmasDesdeStorage(){

    try{

        const response = await fetch(
            "historial_alarmas.json?v=" + new Date().getTime()
        );

        const data = await response.json();

        alarmsArray = data.map(a => ({

            id:a.id,
            tag:a.tag,

            timestamp:new Date(a.inicio),

            message:a.mensaje,

            severity:a.severity.toLowerCase(),

            reviewed:a.reviewed,

            activa:a.activa

        }));

        renderizarTabla();

    }catch(error){

        console.error(error);

        alarmsArray=[];

        renderizarTabla();

    }

}

function formatearFecha(date){

    return `${date.toLocaleDateString('es-PE')}
    ${date.toLocaleTimeString('es-PE',{hour12:false})}`;

}

function getAlarmasFiltradas(){

    const filterTag =
        document.getElementById("filterTag").value.toLowerCase();

    const filterMessage =
        document.getElementById("filterMessage").value.toLowerCase();

    const filterSeverity =
        document.getElementById("filterSeverity").value;

    const filterStatus =
        document.getElementById("filterStatus").value;

    let filtered = [...alarmsArray];

    if(filterTag){
        filtered = filtered.filter(a =>
            a.tag.toLowerCase().includes(filterTag)
        );
    }

    if(filterMessage){
        filtered = filtered.filter(a =>
            a.message.toLowerCase().includes(filterMessage)
        );
    }

    if(filterSeverity){
        filtered = filtered.filter(a =>
            a.severity === filterSeverity
        );
    }

    if(filterStatus === "reviewed"){
        filtered = filtered.filter(a => a.reviewed);
    }

    if(filterStatus === "unreviewed"){
        filtered = filtered.filter(a => !a.reviewed);
    }

    filtered.sort((a,b)=>b.timestamp-a.timestamp);

    return filtered;

}

function renderizarTabla(){

    const tbody =
        document.getElementById("alarmsTableBody");

    tbody.innerHTML="";

    const filtered = getAlarmasFiltradas();

    document.getElementById("unreviewedCount").innerText =
        alarmsArray.filter(a=>!a.reviewed).length;

    document.getElementById("reviewedCount").innerText =
        alarmsArray.filter(a=>a.reviewed).length;

    document.getElementById("totalCount").innerText =
        alarmsArray.length;

    if(filtered.length===0){

        tbody.innerHTML=`
        <tr>
            <td colspan="6" style="text-align:center;padding:40px;">
                📭 NO HAY ALARMAS
            </td>
        </tr>
        `;

        return;
    }

    filtered.forEach(alarm=>{

        const row = tbody.insertRow();

        row.className =
            alarm.reviewed ?
            "reviewed-row" :
            "unreviewed-row";

        let severityText="";

        if(alarm.severity==="trip"){
            severityText="🚨 TRIP";
        }
        else if(alarm.severity==="alarm"){
            severityText="⚠️ ALARMA";
        }
        else{
            severityText="⚡ WARNING";
        }

        row.innerHTML = `

        <td>
            <input
                type="checkbox"
                class="alarm-checkbox"
                data-id="${alarm.id}">
        </td>

        <td>${formatearFecha(alarm.timestamp)}</td>

        <td>${alarm.tag}</td>

        <td>
            <span class="severity-badge ${alarm.severity}">
                ${severityText}
            </span>
        </td>

        <td>${alarm.message}</td>

        <td>
            <span class="status-badge ${
                alarm.reviewed ?
                'status-reviewed' :
                'status-unreviewed'
            }">
                ${
                    alarm.reviewed ?
                    'REVISADA' :
                    'NO REVISADA'
                }
            </span>
        </td>

        `;

    });

}

function guardarAlarmas(){

    console.log("Cambios locales");

}

function reviewSelected(){

    const checkboxes =
        document.querySelectorAll(
            ".alarm-checkbox:checked"
        );

    checkboxes.forEach(cb=>{

        const id = cb.dataset.id;

        const alarm =
            alarmsArray.find(a=>a.id===id);

        if(alarm){
            alarm.reviewed=true;
        }

    });

    renderizarTabla();

}

function reviewAll(){

    alarmsArray.forEach(a=>{
        a.reviewed=true;
    });

    renderizarTabla();

}

function clearReviewed(){

    alarmsArray =
        alarmsArray.filter(a=>!a.reviewed);

    renderizarTabla();

}

function clearAll(){

    alarmsArray=[];

    renderizarTabla();

}

function exportToPDF(){

    html2pdf(document.body);

}

document.getElementById("reviewSelectedBtn")
.addEventListener("click",reviewSelected);

document.getElementById("reviewAllBtn")
.addEventListener("click",reviewAll);

document.getElementById("clearReviewedBtn")
.addEventListener("click",clearReviewed);

document.getElementById("clearAllBtn")
.addEventListener("click",clearAll);

document.getElementById("exportPdfBtn")
.addEventListener("click",exportToPDF);

document.getElementById("applyFiltersBtn")
.addEventListener("click",renderizarTabla);

document.getElementById("resetFiltersBtn")
.addEventListener("click",()=>{

    document.getElementById("filterTag").value="";
    document.getElementById("filterMessage").value="";
    document.getElementById("filterSeverity").value="";
    document.getElementById("filterStatus").value="";

    renderizarTabla();

});

document.getElementById("selectAllCheckbox")
.addEventListener("change",(e)=>{

    document.querySelectorAll(".alarm-checkbox")
    .forEach(cb=>{
        cb.checked=e.target.checked;
    });

});

cargarAlarmasDesdeStorage();

setInterval(
    cargarAlarmasDesdeStorage,
    5000
);

</script>

</body>
