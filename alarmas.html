<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA COLECTOR - HISTORIAL DE ALARMAS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    height:100vh;
    overflow:hidden;
}

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ================= TOPBAR ================= */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

.btn-volver{
    background:#1d4ed8;
    color:white;
    padding:8px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
}

/* ================= MAIN ================= */

.main-content{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ================= CONTADORES ================= */

.counters-panel{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.counter-card{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:20px;
    flex:1;
    min-width:180px;
    text-align:center;
}

.counter-number{
    font-size:42px;
    font-weight:bold;
}

.counter-label{
    margin-top:10px;
    font-size:14px;
}

.alarmas-color .counter-number{
    color:#d50000;
}

.activas-color .counter-number{
    color:#00c853;
}

.total-color .counter-number{
    color:#09234d;
}

/* ================= TOOLBAR ================= */

.toolbar{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.btn-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.btn-primary{ background:#1d4ed8; }
.btn-success{ background:#00c853; }
.btn-danger{ background:#d50000; }
.btn-secondary{ background:#6c757d; }

.btn:hover{
    opacity:0.9;
}

/* ================= FILTROS ================= */

.filters-bar{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

.filter-input,
.filter-select{
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    min-width:170px;
}

/* ================= TABLA ================= */

.table-wrapper{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    overflow:auto;
    max-height:78vh;
}

.alarms-table{
    width:100%;
    border-collapse:collapse;
    min-width:1800px;
}

.alarms-table th{
    background:#09234d;
    color:white;
    padding:12px;
    position:sticky;
    top:0;
    z-index:10;
    font-size:13px;
}

.alarms-table td{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:13px;
}

tbody tr{
    height:42px;
}

.activa-row{
    background:#ffebee;
}

.finalizada-row{
    background:#f5f5f5;
}

.severity-badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.trip{
    background:#b71c1c;
    color:white;
}

.alarm{
    background:#d50000;
    color:white;
}

.warning{
    background:#ff9800;
    color:black;
}

.estado-activa{
    color:#00c853;
    font-weight:bold;
}

.estado-finalizada{
    color:#d50000;
    font-weight:bold;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1200px){

    .topbar{
        flex-direction:column;
        height:auto;
        padding:10px;
        gap:10px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- ================= TOPBAR ================= -->

<div class="topbar">

    <div class="logo-area">
        <div class="hamburguesa" onclick="toggleMenu()">☰</div>
        <div class="logo">AMERICORP</div>
    </div>

    <div>
        PROYECTO: COLECTOR DE POLVO | HISTORIAL DE ALARMAS
    </div>

    <div style="display:flex; gap:15px; align-items:center;">
        <div class="fecha-hora" id="fechaHora"></div>
        <a href="index.html" class="btn-volver">⬅ VOLVER</a>
    </div>

</div>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar" id="sidebar">

    <div class="menu">

        <div class="menu-item"
             onclick="window.location.href='index.html'">

            📊 Dashboard

        </div>

        <div class="menu-item"
             style="background:#12356d;">

            🚨 Alarmas

        </div>

        <div class="menu-item"
             onclick="window.location.href='tendencias.html'">

            📈 Tendencias

        </div>

    </div>

    <div class="sidebar-imagen">
        <img src="colector.png">
    </div>

</div>

<!-- ================= MAIN ================= -->

<div class="main-content">

<!-- ================= CONTADORES ================= -->

<div class="counters-panel">

    <div class="counter-card alarmas-color">

        <div class="counter-number" id="alarmCount">0</div>

        <div class="counter-label">
            ⚠️ ALARMAS
        </div>

    </div>

    <div class="counter-card activas-color">

        <div class="counter-number" id="activeCount">0</div>

        <div class="counter-label">
            🟢 ACTIVAS
        </div>

    </div>

    <div class="counter-card total-color">

        <div class="counter-number" id="totalCount">0</div>

        <div class="counter-label">
            📋 TOTAL HISTÓRICO
        </div>

    </div>

</div>

<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

    <div class="btn-group">

        <button class="btn btn-primary"
                onclick="exportarPDF()">

            📄 EXPORTAR PDF

        </button>

        <button class="btn btn-success"
                onclick="exportarCSV()">

            📥 EXPORTAR CSV

        </button>

    </div>

</div>

<!-- ================= FILTROS ================= -->

<div class="filters-bar">

    <input type="text"
           id="filterTag"
           class="filter-input"
           placeholder="FILTRAR TAG">

    <input type="text"
           id="filterMensaje"
           class="filter-input"
           placeholder="FILTRAR MENSAJE">

    <select id="filterSeverity"
            class="filter-select">

        <option value="">SEVERIDAD</option>

        <option value="trip">TRIP</option>

        <option value="alarm">ALARMA</option>

        <option value="warning">WARNING</option>

    </select>

    <input type="date"
           id="fechaInicio"
           class="filter-input">

    <input type="date"
           id="fechaFin"
           class="filter-input">

    <button class="btn btn-primary"
            onclick="renderizarTabla()">

        APLICAR

    </button>

    <button class="btn btn-secondary"
            onclick="resetFiltros()">

        RESET

    </button>

</div>

<!-- ================= TABLA ================= -->

<div class="table-wrapper" id="tablaExportar">

<table class="alarms-table">

<thead>

<tr>

<th>FECHA-HORA</th>

<th>TAG</th>

<th>NOMBRE ALARMA</th>

<th>SEVERIDAD</th>

<th>VALOR</th>

<th>TIEMPO INICIO</th>

<th>TIEMPO FIN</th>

<th>DURACIÓN</th>

<th>ESTADO</th>

<th>MENSAJE</th>

</tr>

</thead>

<tbody id="alarmsTableBody"></tbody>

</table>

</div>

</div>

</div>

<script>

let alarmsArray = [];

/* ================= MENU ================= */

function toggleMenu(){

    document
    .getElementById("sidebar")
    .classList.toggle("activo");

}

/* ================= FECHA ================= */

function actualizarFechaHora(){

    const ahora = new Date();

    document.getElementById("fechaHora").innerHTML =
        ahora.toLocaleTimeString("es-PE",{
            hour12:false
        }) +
        " | " +
        ahora.toLocaleDateString("es-PE");

}

setInterval(actualizarFechaHora,1000);

actualizarFechaHora();

/* ================= CARGAR JSON ================= */

async function cargarAlarmas(){

    try{

        const response = await fetch(
            "historial_alarmas.json?v=" + new Date().getTime()
        );

        const data = await response.json();

        alarmsArray = data.map(a => ({

            fechaHora: a.inicio || "",

            tag: a.tag || "",

            nombre: a.mensaje || "",

            severity: (a.severity || "warning").toLowerCase(),

            valor: a.valor || "",

            inicio: a.inicio || "",

            fin: a.fin || "-",

            duracion: a.duracion || "",

            activa: a.activa,

            mensaje: a.mensaje || ""

        }));

        renderizarTabla();

    }catch(error){

        console.error("ERROR CARGANDO ALARMAS:", error);

    }

}

/* ================= FILTRAR ================= */

function getAlarmasFiltradas(){

    const filterTag =
        document.getElementById("filterTag")
        .value.toLowerCase();

    const filterMensaje =
        document.getElementById("filterMensaje")
        .value.toLowerCase();

    const filterSeverity =
        document.getElementById("filterSeverity")
        .value;

    const fechaInicio =
        document.getElementById("fechaInicio")
        .value;

    const fechaFin =
        document.getElementById("fechaFin")
        .value;

    let filtered = [...alarmsArray];

    if(filterTag){

        filtered = filtered.filter(a =>
            a.tag.toLowerCase().includes(filterTag)
        );

    }

    if(filterMensaje){

        filtered = filtered.filter(a =>
            a.mensaje.toLowerCase().includes(filterMensaje)
        );

    }

    if(filterSeverity){

        filtered = filtered.filter(a =>
            a.severity === filterSeverity
        );

    }

    if(fechaInicio){

        filtered = filtered.filter(a => {

            const fecha =
                new Date(a.inicio);

            return fecha >= new Date(fechaInicio);

        });

    }

    if(fechaFin){

        filtered = filtered.filter(a => {

            const fecha =
                new Date(a.inicio);

            return fecha <=
                new Date(fechaFin + "T23:59:59");

        });

    }

    filtered.sort((a,b)=>
        new Date(b.inicio) - new Date(a.inicio)
    );

    return filtered;

}

/* ================= TABLA ================= */

function renderizarTabla(){

    const tbody =
        document.getElementById("alarmsTableBody");

    tbody.innerHTML = "";

    const filtered =
        getAlarmasFiltradas();

    document.getElementById("alarmCount")
    .innerText =
        alarmsArray.filter(a =>
            a.severity === "alarm"
        ).length;

    document.getElementById("activeCount")
    .innerText =
        alarmsArray.filter(a =>
            a.activa
        ).length;

    document.getElementById("totalCount")
    .innerText =
        alarmsArray.length;

    if(filtered.length === 0){

        tbody.innerHTML = `
        <tr>
            <td colspan="10"
                style="
                    text-align:center;
                    padding:40px;
                ">

                📭 NO HAY ALARMAS

            </td>
        </tr>
        `;

        return;

    }

    filtered.forEach(alarm => {

        const row = tbody.insertRow();

        row.className =
            alarm.activa
            ? "activa-row"
            : "finalizada-row";

        let severityText = "";

        if(alarm.severity === "trip"){

            severityText = "🚨 TRIP";

        }
        else if(alarm.severity === "alarm"){

            severityText = "⚠️ ALARMA";

        }
        else{

            severityText = "⚡ WARNING";

        }

        row.innerHTML = `

        <td>${formatearFecha(alarm.fechaHora)}</td>

        <td>${alarm.tag}</td>

        <td>${alarm.nombre}</td>

        <td>
            <span class="severity-badge ${alarm.severity}">
                ${severityText}
            </span>
        </td>

        <td>${alarm.valor}</td>

        <td>${formatearFecha(alarm.inicio)}</td>

        <td>
            ${
                alarm.fin === "-"
                ? "-"
                : formatearFecha(alarm.fin)
            }
        </td>

        <td>${alarm.duracion}</td>

        <td>
            ${
                alarm.activa
                ?
                '<span class="estado-activa">ACTIVA</span>'
                :
                '<span class="estado-finalizada">FINALIZADA</span>'
            }
        </td>

        <td>${alarm.mensaje}</td>

        `;

    });

}

/* ================= FORMATO FECHA ================= */

function formatearFecha(fecha){

    if(!fecha || fecha === "-"){
        return "-";
    }

    const d = new Date(fecha);

    return d.toLocaleDateString("es-PE") +
    " " +
    d.toLocaleTimeString("es-PE",{
        hour12:false
    });

}

/* ================= RESET ================= */

function resetFiltros(){

    document.getElementById("filterTag").value = "";

    document.getElementById("filterMensaje").value = "";

    document.getElementById("filterSeverity").value = "";

    document.getElementById("fechaInicio").value = "";

    document.getElementById("fechaFin").value = "";

    renderizarTabla();

}

/* ================= PDF ================= */

function exportarPDF(){

    const elemento =
        document.getElementById("tablaExportar");

    const opciones = {

        margin:0.3,

        filename:"historial_alarmas.pdf",

        image:{
            type:"jpeg",
            quality:1
        },

        html2canvas:{
            scale:2,
            scrollX:0,
            scrollY:0
        },

        jsPDF:{
            unit:"in",
            format:"a3",
            orientation:"landscape"
        },

        pagebreak:{
            mode:['avoid-all','css','legacy']
        }

    };

    html2pdf()
        .set(opciones)
        .from(elemento)
        .save();

}

/* ================= CSV ================= */

function exportarCSV(){

    const filtered =
        getAlarmasFiltradas();

    let csv =
`FECHA_HORA,TAG,NOMBRE_ALARMA,SEVERIDAD,VALOR,TIEMPO_INICIO,TIEMPO_FIN,DURACION,ESTADO,MENSAJE\n`;

    filtered.forEach(a => {

        csv += `"${a.fechaHora}","${a.tag}","${a.nombre}","${a.severity}","${a.valor}","${a.inicio}","${a.fin}","${a.duracion}","${a.activa ? 'ACTIVA':'FINALIZADA'}","${a.mensaje}"\n`;

    });

    const blob =
        new Blob(
            ["\ufeff" + csv],
            {
                type:"text/csv;charset=utf-8;"
            }
        );

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "historial_alarmas.csv";

    a.click();

}

/* ================= AUTO UPDATE ================= */

cargarAlarmas();

setInterval(
    cargarAlarmas,
    10000
);

</script>

</body>

</html>
