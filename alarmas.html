<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCADA COLECTOR - HISTORIAL DE ALARMAS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    overflow:hidden;
}

/* ========================= */
/* CONTENEDOR */
/* ========================= */

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ========================= */
/* TOPBAR */
/* ========================= */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

.btn-volver{
    background:#1565c0;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
}

/* ========================= */
/* SIDEBAR */
/* ========================= */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
    border-bottom-right-radius:10px;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
}

/* ========================= */
/* MAIN */
/* ========================= */

.main{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ========================= */
/* CONTADORES */
/* ========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    border:2px solid #b0b0b0;
}

.card h2{
    font-size:42px;
}

.card p{
    margin-top:10px;
    font-weight:bold;
}

.rojo h2{
    color:#d50000;
}

.verde h2{
    color:#00c853;
}

.azul h2{
    color:#09234d;
}

/* ========================= */
/* BOTONES */
/* ========================= */

.toolbar{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    border:2px solid #b0b0b0;
}

.btn{
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.btn-primary{
    background:#1565c0;
}

.btn-success{
    background:#00c853;
}

.btn-warning{
    background:#ff9800;
}

.btn-danger{
    background:#d50000;
}

/* ========================= */
/* TABLA */
/* ========================= */

.table-container{
    background:white;
    border-radius:12px;
    border:2px solid #b0b0b0;
    overflow:auto;
    max-height:65vh;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    position:sticky;
    top:0;
    z-index:100;
}

th{
    background:#09234d;
    color:white;
    padding:14px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #e0e0e0;
}

tr:hover{
    background:#f5f5f5;
}

/* ========================= */
/* SEVERIDAD */
/* ========================= */

.trip{
    border-left:8px solid #d50000;
}

.warning{
    border-left:8px solid #ff9800;
}

/* ========================= */
/* ESTADO */
/* ========================= */

.badge{
    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.badge-warning{
    background:#ff9800;
}

.badge-trip{
    background:#d50000;
}

.badge-review{
    background:#00c853;
}

.badge-unreview{
    background:#d50000;
}

/* ========================= */
/* CHECKBOX */
/* ========================= */

.alarm-check{
    width:18px;
    height:18px;
}

/* ========================= */
/* PDF */
/* ========================= */

.pdf-export{
    background:white;
    padding:20px;
}

</style>

</head>

<body>

<div class="container">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="logo-area">

            <div class="hamburguesa" onclick="toggleMenu()">
                ☰
            </div>

            <div class="logo">
                AMERICORP
            </div>

        </div>

        <div>
            HISTORIAL DE ALARMAS
        </div>

        <div style="display:flex;align-items:center;gap:15px;">

            <div class="fecha-hora" id="fechaHora">
                --:--:--
            </div>

            <a href="index.html" class="btn-volver">
                ⬅ VOLVER
            </a>

        </div>

    </div>

    <!-- SIDEBAR -->

    <div class="sidebar" id="sidebar">

        <div class="menu">

            <div class="menu-item"
                onclick="window.location.href='index.html'">
                📊 Dashboard
            </div>

            <div class="menu-item"
                onclick="window.location.href='alarmas.html'">
                🚨 Alarmas
            </div>

            <div class="menu-item">
                📈 Tendencias
            </div>

            <div class="menu-item">
                ⚙️ Configuración
            </div>

        </div>

        <div class="sidebar-imagen">

            <img src="colector.png">

        </div>

    </div>

    <!-- MAIN -->

    <div class="main" id="pdfArea">

        <!-- CONTADORES -->

        <div class="cards">

            <div class="card rojo">

                <h2 id="noRevisadas">
                    0
                </h2>

                <p>
                    NO REVISADAS
                </p>

            </div>

            <div class="card verde">

                <h2 id="revisadas">
                    0
                </h2>

                <p>
                    REVISADAS
                </p>

            </div>

            <div class="card azul">

                <h2 id="totalAlarmas">
                    0
                </h2>

                <p>
                    TOTAL ALARMAS
                </p>

            </div>

        </div>

        <!-- TOOLBAR -->

        <div class="toolbar">

            <button class="btn btn-success"
                onclick="revisarSeleccionadas()">
                ✅ REVISAR SELECCIONADAS
            </button>

            <button class="btn btn-primary"
                onclick="revisarTodas()">
                🔄 REVISAR TODAS
            </button>

            <button class="btn btn-warning"
                onclick="borrarRevisadas()">
                🗑 BORRAR REVISADAS
            </button>

            <button class="btn btn-danger"
                onclick="borrarTodas()">
                ❌ BORRAR TODAS
            </button>

            <button class="btn btn-primary"
                onclick="exportarPDF()">
                📄 EXPORTAR PDF
            </button>

        </div>

        <!-- TABLA -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            <input type="checkbox"
                                id="selectAll">
                        </th>

                        <th>
                            FECHA
                        </th>

                        <th>
                            TAG
                        </th>

                        <th>
                            MENSAJE
                        </th>

                        <th>
                            SEVERIDAD
                        </th>

                        <th>
                            ESTADO
                        </th>

                    </tr>

                </thead>

                <tbody id="tablaAlarmas">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

/* ========================= */
/* MENU */
/* ========================= */

function toggleMenu(){

    document
    .getElementById("sidebar")
    .classList
    .toggle("activo");

}

/* ========================= */
/* FECHA Y HORA */
/* ========================= */

function actualizarFechaHora(){

    const ahora = new Date();

    document.getElementById("fechaHora").innerHTML =
        ahora.toLocaleTimeString() +
        " | " +
        ahora.toLocaleDateString();

}

setInterval(actualizarFechaHora,1000);
actualizarFechaHora();

/* ========================= */
/* ALARMAS */
/* ========================= */

let alarmas = [];

/* ========================= */
/* CARGAR */
/* ========================= */

function cargarAlarmas(){

    alarmas =
        JSON.parse(
            localStorage.getItem("scada_alarmas")
        ) || [];

    renderTabla();

}

/* ========================= */
/* RENDER */
/* ========================= */

function renderTabla(){

    const tbody =
        document.getElementById("tablaAlarmas");

    tbody.innerHTML = "";

    let noRev = 0;
    let rev = 0;

    alarmas.forEach((al,index)=>{

        if(al.revisado){
            rev++;
        }else{
            noRev++;
        }

        const tr =
            document.createElement("tr");

        tr.className = al.severidad;

        tr.innerHTML = `

            <td>
                <input 
                    type="checkbox"
                    class="alarm-check"
                    value="${index}">
            </td>

            <td>
                ${al.fecha}
            </td>

            <td>
                ${al.tag}
            </td>

            <td>
                ${al.mensaje}
            </td>

            <td>

                <span class="
                    badge
                    ${al.severidad === 'trip'
                        ? 'badge-trip'
                        : 'badge-warning'}
                ">

                    ${al.severidad.toUpperCase()}

                </span>

            </td>

            <td>

                ${
                    al.revisado

                    ?

                    `<span class="badge badge-review">
                        REVISADA
                    </span>`

                    :

                    `<span class="badge badge-unreview">
                        NO REVISADA
                    </span>`
                }

            </td>

        `;

        tbody.appendChild(tr);

    });

    document.getElementById("noRevisadas")
        .innerText = noRev;

    document.getElementById("revisadas")
        .innerText = rev;

    document.getElementById("totalAlarmas")
        .innerText = alarmas.length;

}

/* ========================= */
/* REVISAR SELECCIONADAS */
/* ========================= */

function revisarSeleccionadas(){

    const checks =
        document.querySelectorAll(
            ".alarm-check:checked"
        );

    checks.forEach(c=>{

        const idx =
            parseInt(c.value);

        if(alarmas[idx]){

            alarmas[idx].revisado = true;

        }

    });

    localStorage.setItem(
        "scada_alarmas",
        JSON.stringify(alarmas)
    );

    renderTabla();

}

/* ========================= */
/* REVISAR TODAS */
/* ========================= */

function revisarTodas(){

    alarmas.forEach(al=>{

        al.revisado = true;

    });

    localStorage.setItem(
        "scada_alarmas",
        JSON.stringify(alarmas)
    );

    renderTabla();

}

/* ========================= */
/* BORRAR REVISADAS */
/* ========================= */

function borrarRevisadas(){

    alarmas =
        alarmas.filter(al=>!al.revisado);

    localStorage.setItem(
        "scada_alarmas",
        JSON.stringify(alarmas)
    );

    renderTabla();

}

/* ========================= */
/* BORRAR TODAS */
/* ========================= */

function borrarTodas(){

    if(confirm("¿BORRAR TODAS LAS ALARMAS?")){

        alarmas = [];

        localStorage.setItem(
            "scada_alarmas",
            JSON.stringify(alarmas)
        );

        renderTabla();

    }

}

/* ========================= */
/* EXPORTAR PDF */
/* ========================= */

function exportarPDF(){

    const area =
        document.getElementById("pdfArea");

    const opt = {

        margin:0.5,

        filename:
            'historial_alarmas.pdf',

        image:{
            type:'jpeg',
            quality:1
        },

        html2canvas:{
            scale:2,
            scrollY:0
        },

        jsPDF:{
            unit:'in',
            format:'a3',
            orientation:'landscape'
        }

    };

    html2pdf()
        .set(opt)
        .from(area)
        .save();

}

/* ========================= */
/* SELECT ALL */
/* ========================= */

document
.getElementById("selectAll")
.addEventListener("change",function(){

    const checks =
        document.querySelectorAll(".alarm-check");

    checks.forEach(c=>{

        c.checked = this.checked;

    });

});

/* ========================= */
/* ACTUALIZAR AUTOMATICO */
/* ========================= */

window.addEventListener("storage",()=>{

    cargarAlarmas();

});

setInterval(()=>{

    cargarAlarmas();

},60000);

/* ========================= */
/* INICIO */
/* ========================= */

cargarAlarmas();

</script>

</body>

</html>
