<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TENDENCIAS - MOTOR 1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    overflow:hidden;
}

/* ================= CONTENEDOR ================= */

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ================= TOPBAR ================= */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
    position:relative;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
    border-bottom-right-radius:10px;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
    opacity:0.95;
}

/* ================= CONTENIDO ================= */

.contenido{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* ================= TARJETAS ================= */

.card{
    background:white;
    border:2px solid #b0b0b0;
    border-radius:10px;
    overflow:hidden;
    height:360px;
    display:flex;
    flex-direction:column;
}

/* ================= TITULO ================= */

.titulo{
    background:#f5f5f5;
    border-bottom:1px solid #d0d0d0;
    padding:12px 15px;
    font-size:17px;
    font-weight:bold;
    color:#09234d;
}

/* ================= GRAFICA ================= */

.grafica{
    flex:1;
    padding:10px;
}

.chart-wrapper{
    width:100%;
    height:100%;
    overflow-x:auto;
    overflow-y:hidden;
    border:1px solid #d0d0d0;
    border-radius:8px;
    background:white;
}

.chart-container{
    width:1800px;
    height:100%;
}

canvas{
    width:100% !important;
    height:100% !important;
}

/* ================= SCROLL ================= */

.chart-wrapper::-webkit-scrollbar{
    height:8px;
}

.chart-wrapper::-webkit-scrollbar-thumb{
    background:#09234d;
    border-radius:10px;
}

.chart-wrapper::-webkit-scrollbar-track{
    background:#d0d0d0;
}

/* ================= BOTONES ================= */

.botones{
    margin-top:20px;
    display:flex;
    gap:15px;
}

.btn{
    background:#09234d;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#12356d;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        height:320px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- ================= TOPBAR ================= -->

    <div class="topbar">

        <div class="logo-area">

            <div class="hamburguesa"
                 onclick="toggleMenu()">

                ☰

            </div>

            <div class="logo">
                AMERICORP
            </div>

        </div>

        <div>
            PROYECTO: COLECTOR DE POLVO
        </div>

        <div class="fecha-hora"
             id="fechaHora">

            --:--:--

        </div>

    </div>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar"
         id="sidebar">

        <div class="menu">

            <div class="menu-item"
                 onclick="window.location.href='index.html'">

                📊 Dashboard

            </div>

            <div class="menu-item"
                 onclick="window.location.href='alarmas.html'">

                🚨 Alarmas

            </div>

            <div class="menu-item">

                📈 Tendencias

            </div>

        </div>

        <div class="sidebar-imagen">

            <img src="colector.png">

        </div>

    </div>

    <!-- ================= CONTENIDO ================= -->

    <div class="contenido">

        <div class="grid">

            <!-- VOLTAJE -->

            <div class="card">

                <div class="titulo">
                    ⚡ VOLTAJE MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVolt"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- CORRIENTE -->

            <div class="card">

                <div class="titulo">
                    🔌 CORRIENTE MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafAmp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- TEMPERATURA -->

            <div class="card">

                <div class="titulo">
                    🌡 TEMPERATURA MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafTemp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- VIBRACION -->

            <div class="card">

                <div class="titulo">
                    📳 VIBRACIÓN MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVib"></canvas>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="botones">

            <button class="btn"
                    onclick="window.location.href='index.html'">

                ⬅ VOLVER

            </button>

            <button class="btn"
                    onclick="limpiarHistorico()">

                🗑 LIMPIAR HISTÓRICO

            </button>

        </div>

    </div>

</div>

<script>

/* ================= MENU ================= */

function toggleMenu(){

    document
        .getElementById("sidebar")
        .classList.toggle("activo");

}

/* ================= FECHA ================= */

function actualizarFechaHora(){

    const ahora = new Date();

    document.getElementById(
        "fechaHora"
    ).innerHTML =

        ahora.toLocaleTimeString('es-PE')
        + " | " +
        ahora.toLocaleDateString('es-PE');

}

setInterval(actualizarFechaHora,1000);

actualizarFechaHora();

/* ================= STORAGE ================= */

function obtenerHistorico(){

    const datos =
        localStorage.getItem(
            "historico_motor1"
        );

    return datos
        ? JSON.parse(datos)
        : [];

}

function guardarHistorico(datos){

    localStorage.setItem(
        "historico_motor1",
        JSON.stringify(datos)
    );

}

/* ================= HISTORICO ================= */

let historico =
    obtenerHistorico();

/* ================= CREAR GRAFICA ================= */

function crearGrafica(
    id,
    titulo,
    color,
    unidad
){

    return new Chart(

        document.getElementById(id),

        {

            type:'line',

            data:{

                labels:[],

                datasets:[{

                    label:titulo,

                    data:[],

                    borderColor:color,

                    borderWidth:2,

                    pointRadius:2,

                    pointHoverRadius:8,

                    tension:0.3,

                    fill:false

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                interaction:{
                    mode:'nearest',
                    intersect:false
                },

                plugins:{

                    legend:{
                        display:false
                    },

                    tooltip:{

                        backgroundColor:'#09234d',

                        callbacks:{

                            title:function(context){

                                return context[0].label;

                            },

                            label:function(context){

                                return context.parsed.y.toFixed(2)
                                    + " "
                                    + unidad;

                            }

                        }

                    },

                    zoom:{

                        pan:{
                            enabled:true,
                            mode:'x'
                        },

                        zoom:{

                            wheel:{
                                enabled:true
                            },

                            pinch:{
                                enabled:true
                            },

                            mode:'x'

                        }

                    }

                },

                scales:{

                    x:{

                        ticks:{
                            maxTicksLimit:15
                        }

                    },

                    y:{
                        beginAtZero:false
                    }

                }

            }

        }

    );

}

/* ================= GRAFICAS ================= */

const grafVolt =
    crearGrafica(
        "grafVolt",
        "Voltaje",
        "#1565c0",
        "V"
    );

const grafAmp =
    crearGrafica(
        "grafAmp",
        "Corriente",
        "#00a844",
        "A"
    );

const grafTemp =
    crearGrafica(
        "grafTemp",
        "Temperatura",
        "#d50000",
        "°C"
    );

const grafVib =
    crearGrafica(
        "grafVib",
        "Vibración",
        "#ff9800",
        "mm/s"
    );

/* ================= ACTUALIZAR ================= */

function actualizarGraficas(){

    const ultimos15 =
        historico.slice(-15);

    const labels =
        ultimos15.map(
            d => d.fechaCompleta
        );

    grafVolt.data.labels = labels;
    grafAmp.data.labels = labels;
    grafTemp.data.labels = labels;
    grafVib.data.labels = labels;

    grafVolt.data.datasets[0].data =
        ultimos15.map(d => d.voltaje);

    grafAmp.data.datasets[0].data =
        ultimos15.map(d => d.corriente);

    grafTemp.data.datasets[0].data =
        ultimos15.map(d => d.temperatura);

    grafVib.data.datasets[0].data =
        ultimos15.map(d => d.vibracion);

    grafVolt.update();
    grafAmp.update();
    grafTemp.update();
    grafVib.update();

    document.querySelectorAll(
        ".chart-wrapper"
    ).forEach(wrapper => {

        wrapper.scrollLeft =
            wrapper.scrollWidth;

    });

}

/* ================= LEER DATOS ================= */

async function cargarDatos(){

    try{

        const response = await fetch(

            'datos.json?t='
            + new Date().getTime(),

            {
                cache:'no-store'
            }

        );

        const d =
            await response.json();

        const ahora =
            new Date();

        const fechaCompleta =

            ahora.toLocaleDateString('es-PE')
            + " " +
            ahora.toLocaleTimeString('es-PE');

        const nuevo = {

            fechaCompleta:
                fechaCompleta,

            voltaje:
                Number(d.voltaje_r),

            corriente:
                Number(d.corriente_r),

            temperatura:
                Number(d.voltaje_s),

            vibracion:
                Number(d.voltaje_t)

        };

        const ultimo =
            historico[
                historico.length - 1
            ];

        if(
            !ultimo ||
            ultimo.fechaCompleta
            !== fechaCompleta
        ){

            historico.push(nuevo);

            if(historico.length > 500){

                historico =
                    historico.slice(-500);

            }

            guardarHistorico(
                historico
            );

            actualizarGraficas();

        }

    }

    catch(error){

        console.log(error);

    }

}

/* ================= LIMPIAR ================= */

function limpiarHistorico(){

    historico = [];

    guardarHistorico([]);

    actualizarGraficas();

}

/* ================= INICIO ================= */

actualizarGraficas();

cargarDatos();

setInterval(
    cargarDatos,
    60000
);

</script>

</body>
</html>
