<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TENDENCIAS - MOTOR 1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    overflow:hidden;
}

/* ================= CONTENEDOR ================= */

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ================= TOPBAR ================= */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
    position:relative;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
    border-bottom-right-radius:10px;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
    opacity:0.95;
}

/* ================= CONTENIDO ================= */

.contenido{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* ================= TARJETAS ================= */

.card{
    background:white;
    border:2px solid #b0b0b0;
    border-radius:10px;
    overflow:hidden;
    height:360px;
    display:flex;
    flex-direction:column;
}

/* ================= TITULO ================= */

.titulo{
    background:#f5f5f5;
    border-bottom:1px solid #d0d0d0;
    padding:12px 15px;
    font-size:17px;
    font-weight:bold;
    color:#09234d;
}

/* ================= GRAFICA ================= */

.grafica{
    flex:1;
    padding:10px;
}

.chart-wrapper{
    width:100%;
    height:100%;
    overflow-x:auto;
    overflow-y:hidden;
    border:1px solid #d0d0d0;
    border-radius:8px;
    background:white;
}

.chart-container{
    width:1800px;
    height:100%;
}

canvas{
    width:100% !important;
    height:100% !important;
}

/* ================= SCROLL ================= */

.chart-wrapper::-webkit-scrollbar{
    height:8px;
}

.chart-wrapper::-webkit-scrollbar-thumb{
    background:#09234d;
    border-radius:10px;
}

.chart-wrapper::-webkit-scrollbar-track{
    background:#d0d0d0;
}

/* ================= BOTONES ================= */

.botones{
    margin-top:20px;
    display:flex;
    gap:15px;
}

.btn{
    background:#09234d;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#12356d;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        height:320px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- ================= TOPBAR ================= -->

    <div class="topbar">

        <div class="logo-area">

            <div class="hamburguesa"
                 onclick="toggleMenu()">

                ☰

            </div>

            <div class="logo">
                AMERICORP
            </div>

        </div>

        <div>
            PROYECTO: COLECTOR DE POLVO | TENDENCIAS MOTOR 1
        </div>

        <div class="fecha-hora"
             id="fechaHora">

            --:--:--

        </div>

    </div>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar"
         id="sidebar">

        <div class="menu">

            <div class="menu-item"
                 onclick="window.location.href='index.html'">

                📊 Dashboard

            </div>

            <div class="menu-item"
                 onclick="window.location.href='alarmas.html'">

                🚨 Alarmas

            </div>

            <div class="menu-item"
                 onclick="window.location.href='tendencias.html'"
                 style="background:#12356d;">

                📈 Tendencias

            </div>

        </div>

        <div class="sidebar-imagen">

            <img src="colector.png">

        </div>

    </div>

    <!-- ================= CONTENIDO ================= -->

    <div class="contenido">

        <div class="grid">

            <!-- VOLTAJE -->
            <div class="card">

                <div class="titulo">
                    ⚡ VOLTAJE MOTOR 1 (V)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVolt"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- CORRIENTE -->
            <div class="card">

                <div class="titulo">
                    🔌 CORRIENTE MOTOR 1 (A)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafAmp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- TEMPERATURA -->
            <div class="card">

                <div class="titulo">
                    🌡 TEMPERATURA MOTOR 1 (°C)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafTemp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- VIBRACION -->
            <div class="card">

                <div class="titulo">
                    📳 VIBRACIÓN MOTOR 1 (mm/s)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVib"></canvas>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="botones">

            <button class="btn"
                    onclick="window.location.href='index.html'">

                ⬅ VOLVER AL DASHBOARD

            </button>

            <button class="btn"
                    onclick="limpiarHistorico()">

                🗑 LIMPIAR HISTÓRICO

            </button>

            <button class="btn"
                    onclick="cargarDatosManual()"
                    style="background:#ff9800;">

                🔄 FORZAR ACTUALIZACIÓN

            </button>

        </div>

    </div>

</div>

<script>

/* ================= MENU ================= */

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("activo");
}

/* ================= FECHA ================= */

function actualizarFechaHora(){
    const ahora = new Date();
    document.getElementById("fechaHora").innerHTML =
        ahora.toLocaleTimeString('es-PE') + " | " + ahora.toLocaleDateString('es-PE');
}

setInterval(actualizarFechaHora,1000);
actualizarFechaHora();

/* ================= STORAGE ================= */

function obtenerHistorico(){
    const datos = localStorage.getItem("tendencias_motor1_v2");
    if(!datos){
        // Datos de ejemplo para probar
        return [];
    }
    return JSON.parse(datos);
}

function guardarHistorico(datos){
    localStorage.setItem("tendencias_motor1_v2", JSON.stringify(datos));
}

/* ================= HISTORICO ================= */

let historico = obtenerHistorico();

/* ================= CREAR GRAFICA CON ESCALA AUTOMÁTICA ================= */

function crearGrafica(id, titulo, color, unidad){

    return new Chart(
        document.getElementById(id),
        {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: titulo,
                    data: [],
                    borderColor: color,
                    backgroundColor: 'rgba(' + hexToRgb(color) + ', 0.1)',
                    borderWidth: 2,
                    pointRadius: 3,
                    pointHoverRadius: 8,
                    pointBackgroundColor: color,
                    pointBorderColor: 'white',
                    pointBorderWidth: 2,
                    tension: 0.2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: { size: 11 },
                            boxWidth: 12
                        }
                    },
                    tooltip: {
                        backgroundColor: '#09234d',
                        titleColor: 'white',
                        bodyColor: 'white',
                        borderColor: '#ffd700',
                        borderWidth: 1,
                        callbacks: {
                            title: function(context) {
                                return context[0].label;
                            },
                            label: function(context) {
                                return context.parsed.y.toFixed(2) + " " + unidad;
                            }
                        }
                    },
                    zoom: {
                        pan: { enabled: true, mode: 'x' },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            mode: 'x'
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'HORA',
                            color: '#09234d',
                            font: { weight: 'bold', size: 10 }
                        },
                        ticks: {
                            maxTicksLimit: 10,
                            maxRotation: 45,
                            minRotation: 45,
                            autoSkip: true
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: unidad,
                            color: '#09234d',
                            font: { weight: 'bold', size: 10 }
                        },
                        beginAtZero: false,  // IMPORTANTE: No forzar inicio en cero
                        grid: { color: '#e0e0e0' },
                        ticks: {
                            callback: function(value) {
                                return value.toFixed(1) + " " + unidad;
                            }
                        }
                    }
                }
            }
        }
    );
}

// Función auxiliar para convertir hex a rgb
function hexToRgb(hex) {
    let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? 
        parseInt(result[1], 16) + ", " + 
        parseInt(result[2], 16) + ", " + 
        parseInt(result[3], 16) : 
        "0, 0, 0";
}

/* ================= GRAFICAS ================= */

const grafVolt = crearGrafica("grafVolt", "Voltaje", "#1565c0", "V");
const grafAmp = crearGrafica("grafAmp", "Corriente", "#00a844", "A");
const grafTemp = crearGrafica("grafTemp", "Temperatura", "#d50000", "°C");
const grafVib = crearGrafica("grafVib", "Vibración", "#ff9800", "mm/s");

/* ================= ACTUALIZAR GRAFICAS ================= */

function actualizarGraficas(){

    console.log("Actualizando gráficas. Datos en histórico:", historico.length);

    if(historico.length === 0){
        console.log("No hay datos en el histórico");
        return;
    }

    // Mostrar últimos 30 puntos
    const ultimos = historico.slice(-30);
    
    const labels = ultimos.map(d => {
        // Extraer hora para etiquetas
        if(d.fechaCompleta){
            const partes = d.fechaCompleta.split(' ');
            if(partes.length >= 2){
                return partes[1]; // Solo la hora
            }
        }
        return d.fechaCompleta || "Sin hora";
    });
    
    // Actualizar VOLTAJE
    grafVolt.data.labels = labels;
    grafVolt.data.datasets[0].data = ultimos.map(d => d.voltaje || 0);
    grafVolt.update();
    
    // Actualizar CORRIENTE
    grafAmp.data.labels = labels;
    grafAmp.data.datasets[0].data = ultimos.map(d => d.corriente || 0);
    grafAmp.update();
    
    // Actualizar TEMPERATURA
    grafTemp.data.labels = labels;
    grafTemp.data.datasets[0].data = ultimos.map(d => d.temperatura || 0);
    grafTemp.update();
    
    // Actualizar VIBRACION
    grafVib.data.labels = labels;
    grafVib.data.datasets[0].data = ultimos.map(d => d.vibracion || 0);
    grafVib.update();

    // Auto-scroll al final
    document.querySelectorAll(".chart-wrapper").forEach(wrapper => {
        wrapper.scrollLeft = wrapper.scrollWidth;
    });

    console.log("Gráficas actualizadas. Últimos valores:", 
        "V:" + (ultimos[ultimos.length-1]?.voltaje || 0),
        "A:" + (ultimos[ultimos.length-1]?.corriente || 0),
        "°C:" + (ultimos[ultimos.length-1]?.temperatura || 0),
        "mm/s:" + (ultimos[ultimos.length-1]?.vibracion || 0)
    );
}

/* ================= LEER DATOS DESDE JSON ================= */

async function cargarDatos(){

    try{

        console.log("Cargando datos desde datos.json...");

        const response = await fetch(
            'datos.json?t=' + new Date().getTime(),
            { cache: 'no-store' }
        );

        if (!response.ok) {
            throw new Error('Error al cargar datos.json: ' + response.status);
        }

        const d = await response.json();
        
        console.log("Datos recibidos:", d);

        const ahora = new Date();
        
        // Formato de fecha completo
        const fechaCompleta = 
            ahora.toLocaleDateString('es-PE') + " " + 
            ahora.toLocaleTimeString('es-PE');

        // Crear nuevo punto de datos con los valores correctos
        const nuevo = {
            fechaCompleta: fechaCompleta,
            voltaje: parseFloat(d.voltaje_r) || 0,
            corriente: parseFloat(d.corriente_r) || 0,
            temperatura: parseFloat(d.voltaje_s) || 0,
            vibracion: parseFloat(d.voltaje_t) || 0
        };

        console.log("Nuevo dato a guardar:", nuevo);

        // Verificar duplicados (mismo minuto)
        let esDuplicado = false;
        if(historico.length > 0) {
            const ultimo = historico[historico.length - 1];
            if(ultimo.fechaCompleta === fechaCompleta) {
                esDuplicado = true;
                console.log("Dato duplicado, no se guarda");
            }
        }

        if(!esDuplicado){
            historico.push(nuevo);
            
            // Limitar a 200 puntos
            if(historico.length > 200){
                historico = historico.slice(-200);
            }
            
            guardarHistorico(historico);
            actualizarGraficas();
            
            console.log("✅ Dato guardado correctamente. Total puntos:", historico.length);
        }

    } catch(error){
        console.error("❌ Error cargando datos:", error);
    }
}

/* ================= CARGA MANUAL PARA PRUEBA ================= */

function cargarDatosManual() {
    // Crear datos de ejemplo para probar las gráficas
    const ahora = new Date();
    const fechaCompleta = ahora.toLocaleDateString('es-PE') + " " + ahora.toLocaleTimeString('es-PE');
    
    const datosEjemplo = {
        voltaje_r: 220 + Math.random() * 10,
        corriente_r: 15 + Math.random() * 5,
        voltaje_s: 45 + Math.random() * 10,
        voltaje_t: 2 + Math.random() * 4
    };
    
    const nuevo = {
        fechaCompleta: fechaCompleta,
        voltaje: parseFloat(datosEjemplo.voltaje_r),
        corriente: parseFloat(datosEjemplo.corriente_r),
        temperatura: parseFloat(datosEjemplo.voltaje_s),
        vibracion: parseFloat(datosEjemplo.voltaje_t)
    };
    
    historico.push(nuevo);
    
    if(historico.length > 200){
        historico = historico.slice(-200);
    }
    
    guardarHistorico(historico);
    actualizarGraficas();
    
    console.log("📊 Dato de prueba agregado manualmente:", nuevo);
}

/* ================= LIMPIAR HISTORICO ================= */

function limpiarHistorico(){
    if(confirm('⚠️ ¿Seguro que deseas borrar TODO el histórico de tendencias?\n\nEsta acción no se puede deshacer.')){
        historico = [];
        guardarHistorico([]);
        actualizarGraficas();
        console.log("🗑 Histórico limpiado");
    }
}

/* ================= INICIALIZAR ================= */

// Verificar si hay datos, si no, cargar algunos de ejemplo
if(historico.length === 0){
    console.log("No hay datos guardados. Creando datos de ejemplo...");
    // Crear 5 datos de ejemplo
    for(let i = 5; i >= 0; i--){
        const fecha = new Date();
        fecha.setMinutes(fecha.getMinutes() - i * 5);
        const fechaStr = fecha.toLocaleDateString('es-PE') + " " + fecha.toLocaleTimeString('es-PE');
        
        historico.push({
            fechaCompleta: fechaStr,
            voltaje: 215 + Math.random() * 15,
            corriente: 12 + Math.random() * 8,
            temperatura: 40 + Math.random() * 15,
            vibracion: 1 + Math.random() * 5
        });
    }
    guardarHistorico(historico);
}

// Mostrar datos actuales en consola
console.log("Histórico cargado:", historico.length, "puntos");
console.log("Último dato:", historico[historico.length - 1]);

// Inicializar gráficas
actualizarGraficas();

// Cargar datos reales
cargarDatos();

// Actualizar cada 30 segundos
setInterval(cargarDatos, 30000);

// Cerrar sidebar al hacer clic fuera
document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburguesa = document.querySelector('.hamburguesa');
    
    if(sidebar && sidebar.classList.contains('activo')) {
        if(!sidebar.contains(event.target) && !hamburguesa.contains(event.target)) {
            sidebar.classList.remove('activo');
        }
    }
});

console.log("📊 Página de tendencias inicializada");

</script>

</body>

</html>
