<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TENDENCIAS - MOTOR 1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#d9d9d9;
    overflow:hidden;
}

/* ================= CONTENEDOR ================= */

.container{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* ================= TOPBAR ================= */

.topbar{
    height:75px;
    background:#09234d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    color:white;
    position:relative;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:15px;
}

.hamburguesa{
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.fecha-hora{
    font-size:18px;
    font-weight:bold;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:absolute;
    top:75px;
    left:0;
    width:260px;
    background:#09234d;
    color:white;
    transform:translateX(-100%);
    transition:0.3s;
    z-index:999;
    border-right:2px solid #1d4ed8;
    border-bottom-right-radius:10px;
}

.sidebar.activo{
    transform:translateX(0);
}

.menu{
    padding-top:15px;
}

.menu-item{
    padding:18px 25px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.menu-item:hover{
    background:#12356d;
}

.sidebar-imagen{
    padding:20px;
    text-align:center;
}

.sidebar-imagen img{
    width:180px;
    opacity:0.95;
}

/* ================= CONTENIDO ================= */

.contenido{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* ================= TARJETAS ================= */

.card{
    background:white;
    border:2px solid #b0b0b0;
    border-radius:10px;
    overflow:hidden;
    height:360px;
    display:flex;
    flex-direction:column;
}

/* ================= TITULO ================= */

.titulo{
    background:#f5f5f5;
    border-bottom:1px solid #d0d0d0;
    padding:12px 15px;
    font-size:17px;
    font-weight:bold;
    color:#09234d;
}

/* ================= GRAFICA ================= */

.grafica{
    flex:1;
    padding:10px;
}

.chart-wrapper{
    width:100%;
    height:100%;
    overflow-x:auto;
    overflow-y:hidden;
    border:1px solid #d0d0d0;
    border-radius:8px;
    background:white;
}

.chart-container{
    width:1800px;
    height:100%;
}

canvas{
    width:100% !important;
    height:100% !important;
}

/* ================= SCROLL ================= */

.chart-wrapper::-webkit-scrollbar{
    height:8px;
}

.chart-wrapper::-webkit-scrollbar-thumb{
    background:#09234d;
    border-radius:10px;
}

.chart-wrapper::-webkit-scrollbar-track{
    background:#d0d0d0;
}

/* ================= BOTONES ================= */

.botones{
    margin-top:20px;
    display:flex;
    gap:15px;
}

.btn{
    background:#09234d;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#12356d;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        height:320px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- ================= TOPBAR ================= -->

    <div class="topbar">

        <div class="logo-area">

            <div class="hamburguesa"
                 onclick="toggleMenu()">

                ☰

            </div>

            <div class="logo">
                AMERICORP
            </div>

        </div>

        <div>
            PROYECTO: COLECTOR DE POLVO | TENDENCIAS MOTOR 1
        </div>

        <div class="fecha-hora"
             id="fechaHora">

            --:--:--

        </div>

    </div>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar"
         id="sidebar">

        <div class="menu">

            <div class="menu-item"
                 onclick="window.location.href='index.html'">

                📊 Dashboard

            </div>

            <div class="menu-item"
                 onclick="window.location.href='alarmas.html'">

                🚨 Alarmas

            </div>

            <div class="menu-item"
                 onclick="window.location.href='tendencias.html'"
                 style="background:#12356d;">

                📈 Tendencias

            </div>

        </div>

        <div class="sidebar-imagen">

            <img src="colector.png">

        </div>

    </div>

    <!-- ================= CONTENIDO ================= -->

    <div class="contenido">

        <div class="grid">

            <!-- VOLTAJE (voltaje_r) -->
            <div class="card">

                <div class="titulo">
                    ⚡ VOLTAJE MOTOR 1 (Fase R)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVolt"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- CORRIENTE (corriente_r) -->
            <div class="card">

                <div class="titulo">
                    🔌 CORRIENTE MOTOR 1 (Fase R)
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafAmp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- TEMPERATURA (voltaje_s) -->
            <div class="card">

                <div class="titulo">
                    🌡 TEMPERATURA MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafTemp"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- VIBRACION (voltaje_t) -->
            <div class="card">

                <div class="titulo">
                    📳 VIBRACIÓN MOTOR 1
                </div>

                <div class="grafica">

                    <div class="chart-wrapper">

                        <div class="chart-container">

                            <canvas id="grafVib"></canvas>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="botones">

            <button class="btn"
                    onclick="window.location.href='index.html'">

                ⬅ VOLVER AL DASHBOARD

            </button>

            <button class="btn"
                    onclick="limpiarHistorico()">

                🗑 LIMPIAR HISTÓRICO

            </button>

        </div>

    </div>

</div>

<script>

/* ================= MENU ================= */

function toggleMenu(){

    document
        .getElementById("sidebar")
        .classList.toggle("activo");

}

/* ================= FECHA ================= */

function actualizarFechaHora(){

    const ahora = new Date();

    document.getElementById(
        "fechaHora"
    ).innerHTML =

        ahora.toLocaleTimeString('es-PE')
        + " | " +
        ahora.toLocaleDateString('es-PE');

}

setInterval(actualizarFechaHora,1000);

actualizarFechaHora();

/* ================= STORAGE ================= */

function obtenerHistorico(){

    const datos =
        localStorage.getItem(
            "tendencias_motor1"
        );

    return datos
        ? JSON.parse(datos)
        : [];

}

function guardarHistorico(datos){

    localStorage.setItem(
        "tendencias_motor1",
        JSON.stringify(datos)
    );

}

/* ================= HISTORICO ================= */

let historico =
    obtenerHistorico();

/* ================= CREAR GRAFICA ================= */

function crearGrafica(
    id,
    titulo,
    color,
    unidad
){

    return new Chart(

        document.getElementById(id),

        {

            type:'line',

            data:{

                labels:[],

                datasets:[{

                    label:titulo,

                    data:[],

                    borderColor:color,

                    backgroundColor:'transparent',

                    borderWidth:2,

                    pointRadius:2,

                    pointHoverRadius:8,

                    pointBackgroundColor:color,

                    pointBorderColor:'white',

                    pointBorderWidth:1,

                    tension:0.2,

                    fill:false

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                interaction:{
                    mode:'index',
                    intersect:false
                },

                plugins:{

                    legend:{
                        display:false
                    },

                    tooltip:{

                        backgroundColor:'#09234d',

                        titleColor:'white',

                        bodyColor:'white',

                        borderColor:'#ffd700',

                        borderWidth:1,

                        callbacks:{

                            title:function(context){

                                return context[0].label;

                            },

                            label:function(context){

                                return context.parsed.y.toFixed(2)
                                    + " "
                                    + unidad;

                            }

                        }

                    },

                    zoom:{

                        pan:{
                            enabled:true,
                            mode:'x'
                        },

                        zoom:{

                            wheel:{
                                enabled:true
                            },

                            pinch:{
                                enabled:true
                            },

                            mode:'x'

                        }

                    }

                },

                scales:{

                    x:{

                        title:{
                            display:true,
                            text:'HORA',
                            color:'#09234d',
                            font:{
                                weight:'bold',
                                size:10
                            }
                        },

                        ticks:{
                            maxTicksLimit:10,
                            maxRotation:45,
                            minRotation:45,
                            autoSkip:true
                        }

                    },

                    y:{

                        title:{
                            display:true,
                            text:unidad,
                            color:'#09234d',
                            font:{
                                weight:'bold',
                                size:10
                            }
                        },

                        beginAtZero:false,

                        grid:{
                            color:'#e0e0e0'
                        }

                    }

                }

            }

        }

    );

}

/* ================= GRAFICAS ================= */

const grafVolt =
    crearGrafica(
        "grafVolt",
        "Voltaje",
        "#1565c0",
        "V"
    );

const grafAmp =
    crearGrafica(
        "grafAmp",
        "Corriente",
        "#00a844",
        "A"
    );

const grafTemp =
    crearGrafica(
        "grafTemp",
        "Temperatura",
        "#d50000",
        "°C"
    );

const grafVib =
    crearGrafica(
        "grafVib",
        "Vibración",
        "#ff9800",
        "mm/s"
    );

/* ================= ACTUALIZAR GRAFICAS ================= */

function actualizarGraficas(){

    if(historico.length === 0){
        // Mostrar mensaje si no hay datos
        return;
    }

    // Mostrar últimos 30 puntos para mejor visualización
    const ultimos =
        historico.slice(-30);

    const labels =
        ultimos.map(d => {
            // Extraer solo la hora para etiquetas más limpias
            const partes = d.fechaCompleta.split(' ');
            return partes.length === 2 ? partes[1] : d.fechaCompleta;
        });

    // Actualizar VOLTAJE
    grafVolt.data.labels = labels;
    grafVolt.data.datasets[0].data =
        ultimos.map(d => d.voltaje);
    grafVolt.update('none');

    // Actualizar CORRIENTE
    grafAmp.data.labels = labels;
    grafAmp.data.datasets[0].data =
        ultimos.map(d => d.corriente);
    grafAmp.update('none');

    // Actualizar TEMPERATURA
    grafTemp.data.labels = labels;
    grafTemp.data.datasets[0].data =
        ultimos.map(d => d.temperatura);
    grafTemp.update('none');

    // Actualizar VIBRACION
    grafVib.data.labels = labels;
    grafVib.data.datasets[0].data =
        ultimos.map(d => d.vibracion);
    grafVib.update('none');

    // Auto-scroll al final en todas las gráficas
    document.querySelectorAll(
        ".chart-wrapper"
    ).forEach(wrapper => {

        wrapper.scrollLeft =
            wrapper.scrollWidth;

    });

    console.log("📊 Gráficas actualizadas - Puntos:", historico.length);

}

/* ================= LEER DATOS DESDE JSON ================= */

async function cargarDatos(){

    try{

        const response = await fetch(

            'datos.json?t='
            + new Date().getTime(),

            {
                cache:'no-store'
            }

        );

        if (!response.ok) {
            throw new Error('Error al cargar datos.json');
        }

        const d =
            await response.json();

        const ahora =
            new Date();

        const fechaCompleta =

            ahora.toLocaleDateString('es-PE')
            + " " +
            ahora.toLocaleTimeString('es-PE');

        // Mapeo CORRECTO según tu index.html original:
        // - voltaje_r: Voltaje Motor 1
        // - corriente_r: Corriente Motor 1  
        // - voltaje_s: Temperatura
        // - voltaje_t: Vibración
        const nuevo = {

            fechaCompleta: fechaCompleta,

            voltaje: Number(d.voltaje_r) || 0,

            corriente: Number(d.corriente_r) || 0,

            temperatura: Number(d.voltaje_s) || 0,

            vibracion: Number(d.voltaje_t) || 0

        };

        // Verificar si es un nuevo registro (evitar duplicados)
        const ultimo =
            historico[historico.length - 1];

        let esDuplicado = false;
        
        if(ultimo) {
            // Comparar si es el mismo segundo exacto
            const diffTiempo = Math.abs(
                new Date(ahora).getTime() - 
                new Date(ultimo.fechaCompleta.split(' ').join('T')).getTime()
            );
            esDuplicado = diffTiempo < 1000; // Menos de 1 segundo
        }

        if(!esDuplicado){

            historico.push(nuevo);

            // Limitar a 200 puntos máximo para rendimiento óptimo
            if(historico.length > 200){

                historico =
                    historico.slice(-200);

            }

            guardarHistorico(
                historico
            );

            actualizarGraficas();
            
            console.log("✅ Nuevo dato guardado:", nuevo.voltaje + "V,", nuevo.corriente + "A,", nuevo.temperatura + "°C,", nuevo.vibracion + "mm/s");

        } else {
            console.log("⏱ Dato duplicado, no se guardó");
        }

    }

    catch(error){

        console.error("❌ Error cargando datos:", error);

    }

}

/* ================= LIMPIAR HISTORICO ================= */

function limpiarHistorico(){

    if(confirm('⚠️ ¿Seguro que deseas borrar TODO el histórico de tendencias?\n\nEsta acción no se puede deshacer.')){
        
        historico = [];

        guardarHistorico([]);

        actualizarGraficas();
        
        console.log("🗑 Histórico limpiado");
    }

}

/* ================= INICIALIZAR ================= */

// Cargar datos existentes del storage
if(historico.length > 0){
    actualizarGraficas();
}

// Cargar datos actuales
cargarDatos();

// Actualizar cada 30 segundos (coherente con index.html)
setInterval(
    cargarDatos,
    30000
);

// Cerrar sidebar al hacer clic fuera (mejora UX)
document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburguesa = document.querySelector('.hamburguesa');
    
    if(sidebar.classList.contains('activo')) {
        if(!sidebar.contains(event.target) && !hamburguesa.contains(event.target)) {
            sidebar.classList.remove('activo');
        }
    }
});

console.log("📊 Página de tendencias inicializada correctamente");

</script>

</body>

</html>
